name: Release package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: hermes-navigator-main-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve automatic release version
        id: identity
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ -n "${APPROVED_SHA}" && "${APPROVED_SHA}" != "${MAIN_SHA}" ]]; then
            echo "CI-approved ${APPROVED_SHA} was superseded by main ${MAIN_SHA}; the newer CI run owns publication."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git checkout -B main origin/main

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          HEAD_SHA="$(git rev-parse HEAD)"

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_SHA}" != "${HEAD_SHA}" ]]; then
              VERSION="$(VERSION="${VERSION}" node -e 'const [a,b,c]=process.env.VERSION.split(".").map(Number); console.log(`${a}.${b}.${c+1}`)')"
              while git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; do
                VERSION="$(VERSION="${VERSION}" node -e 'const [a,b,c]=process.env.VERSION.split(".").map(Number); console.log(`${a}.${b}.${c+1}`)')"
              done
              TAG="v${VERSION}"
              node scripts/prepare-auto-release.mjs "${VERSION}"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json package-lock.json plugin.yaml
              git commit -m "chore(release): bump version to ${VERSION} [skip ci]"
              git push origin HEAD:main
              HEAD_SHA="$(git rev-parse HEAD)"
            fi
          fi

          {
            echo "publish=true"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "commit_sha=${HEAD_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        if: steps.identity.outputs.publish == 'true'
        run: npm ci

      - name: Verify release source
        if: steps.identity.outputs.publish == 'true'
        run: npm run verify

      - name: Build SHA-identified release
        if: steps.identity.outputs.publish == 'true'
        id: release
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "${ACTUAL_SHA}" == "${COMMIT_SHA}" ]] || { echo "Release identity drifted from ${COMMIT_SHA} to ${ACTUAL_SHA}." >&2; exit 1; }
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          ARCHIVE="hermes-navigator-${VERSION}-${SHORT_SHA}.zip"
          node scripts/package.mjs --output "dist/${ARCHIVE}"
          cd dist
          sha256sum "${ARCHIVE}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          VERSION="${VERSION}" COMMIT_SHA="${COMMIT_SHA}" SHORT_SHA="${SHORT_SHA}" ARCHIVE="${ARCHIVE}" ARCHIVE_SHA256="$(cut -d ' ' -f1 SHA256SUMS)" \
            node -e 'const fs=require("fs"); const e=process.env; fs.writeFileSync("RELEASE-METADATA.json", JSON.stringify({version:e.VERSION,commit:e.COMMIT_SHA,short_commit:e.SHORT_SHA,archive:e.ARCHIVE,sha256:e.ARCHIVE_SHA256},null,2)+"\n")'
          {
            echo "short_sha=${SHORT_SHA}"
            echo "archive=${ARCHIVE}"
            echo "artifact_name=hermes-navigator-${VERSION}-${SHORT_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload verified workflow artifact
        if: steps.identity.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            dist/${{ steps.release.outputs.archive }}
            dist/SHA256SUMS
            dist/RELEASE-METADATA.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish automatic GitHub release
        if: steps.identity.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT_SHA: ${{ steps.identity.outputs.commit_sha }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            [[ "${TAG_SHA}" == "${COMMIT_SHA}" ]] || { echo "${TAG} points to ${TAG_SHA}, not ${COMMIT_SHA}." >&2; exit 1; }
          else
            git tag -a "${TAG}" "${COMMIT_SHA}" -m "Hermes Navigator ${TAG}"
            git push origin "${TAG}"
          fi
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" --verify-tag --target "${COMMIT_SHA}" --title "Hermes Navigator ${VERSION}" --generate-notes
          gh release upload "${TAG}" \
            "dist/${ARCHIVE}" \
            "dist/SHA256SUMS" \
            "dist/RELEASE-METADATA.json" \
            --clobber
